[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel-obstacle-detector"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = ["numpy", "scipy", "pyyaml"]

[project.optional-dependencies]
offline = ["rosbags>=0.10"]

[tool.setuptools]
packages = ["detector"]
